# Site de demonstração da OrbitX — nginx:alpine estático.
#
# ⛔ Nunca na rede de outro projeto: em 03/10/2026 este serviço se chamava
# "site", pendurado na infra_default da casa 1001, e o nome do serviço virou
# apelido de rede. Colidiu com o site da 1001, que passou a servir a loja.
# Agora a rede é só deste projeto e o serviço tem nome único.
name: orbitx

services:
  orbitx-demo:
    build: .
    image: orbitx-demo:latest
    container_name: orbitx-demo
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "${ORBITX_PORTA:-8090}:80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - orbitx

networks:
  orbitx:
    name: orbitx_isolada
