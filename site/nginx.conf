server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location ~* \.(webp|jpg|svg|css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
